<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreatLoop - Dashboard</title>
  <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="logo">ThreatLoop</div>
      <nav>
        <a href="index.html" class="active">Dashboard</a>
        <a href="dfd-viewer.html">DFD Viewer</a>
        <a href="backlog.html">Backlog Sync</a>
        <a href="pipeline-runs.html">Pipeline Runs</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
    <div class="main-wrapper">
      <div class="topbar" id="shared-topbar"></div>
      <div class="main-content">
        <h2 style="margin-bottom: 24px;">Dashboard Overview</h2>
        <div class="grid-cols-4">
          <div class="stat-card"><h3>Open Threats</h3><div class="value" id="stat-open">0</div></div>
          <div class="stat-card"><h3>Critical</h3><div class="value" id="stat-critical">0</div></div>
          <div class="stat-card"><h3>Tickets Filed This Sprint</h3><div class="value" id="stat-tickets">0</div></div>
          <div class="stat-card"><h3>Avg. Time to Triage</h3><div class="value">N/A</div></div>
        </div>
        <div class="grid-cols-2">
          <div class="card">
            <h3 style="margin-bottom: 16px;">Threats by Category</h3>
            <div class="chart-container">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
          <div class="card">
            <h3 style="margin-bottom: 16px;">Recent Threats</h3>
            <div style="overflow-x:auto;">
              <table class="tl-table">
                <thead><tr><th>Severity</th><th>Category</th><th>Title</th><th>Status</th><th>Affected Element</th></tr></thead>
                <tbody id="recent-threats-tb"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="./assets/app.js"></script>
  <script>
    document.addEventListener('tl-data-ready', () => {
      window.renderSharedTopbar();
      const threats = window.TLData.threats;
      
      threats.forEach(t => {
        const localStatus = localStorage.getItem('tl_status_' + t.id);
        if(localStatus) t.status = localStatus;
      });

      const openThreats = threats.filter(t => t.status === 'OPEN').length;
      const criticalThreats = threats.filter(t => t.status === 'OPEN' && t.severity === 'CRITICAL').length;
      
      document.getElementById('stat-open').textContent = openThreats;
      document.getElementById('stat-critical').textContent = criticalThreats;
      document.getElementById('stat-tickets').textContent = window.TLData.tickets.length;

      const tb = document.getElementById('recent-threats-tb');
      if(threats.length === 0) {
        tb.innerHTML = '<tr><td colspan="5">No threats found.</td></tr>';
      } else {
        const recent = threats.slice(0, 10);
        tb.innerHTML = recent.map(t => `
          <tr>
            <td>${window.formatSeverity(t.severity)}</td>
            <td>${window.formatCategory(t.category)}</td>
            <td><a href="threat-detail.html?id=${t.id}">${window.escapeHtml(t.title)}</a></td>
            <td>${window.formatStatus(t.status)}</td>
            <td class="mono">${window.escapeHtml(t.affectedElementId || '')}</td>
          </tr>
        `).join('');
      }

      const catCounts = { SPOOFING: 0, TAMPERING: 0, REPUDIATION: 0, INFO_DISCLOSURE: 0, DENIAL_OF_SERVICE: 0, ELEVATION_OF_PRIVILEGE: 0 };
      threats.forEach(t => { if(catCounts[t.category] !== undefined) catCounts[t.category]++; });

      const ctx = document.getElementById('categoryChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(catCounts).map(window.formatCategory),
          datasets: [{
            label: 'Threats',
            data: Object.keys(catCounts).map(k => catCounts[k]),
            backgroundColor: ['#E63946', '#F5A623', '#8B93B8', '#4FC3F7', '#2FBF8F', '#FF6B35']
          }]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    });
  </script>
</body>
</html>
