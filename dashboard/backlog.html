<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Backlog Sync - ThreatLoop</title>
  <link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="logo">ThreatLoop</div>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="dfd-viewer.html">DFD Viewer</a>
        <a href="backlog.html" class="active">Backlog Sync</a>
        <a href="pipeline-runs.html">Pipeline Runs</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
    <div class="main-wrapper">
      <div class="topbar" id="shared-topbar"></div>
      <div class="main-content">
        <h2 style="margin-bottom: 24px;">Backlog Sync</h2>
        
        <div class="card" style="margin-bottom: 24px; display:flex; align-items:center; gap:12px;">
          <div style="width:12px; height:12px; border-radius:50%; background:var(--low);"></div>
          <span style="font-weight:bold;">Sync Active</span>
          <span style="color:var(--muted); margin-left:auto;" id="sync-status-text">Last synced: Never</span>
        </div>

        <div style="margin-bottom: 16px; display:flex; gap:12px;">
          <button class="btn btn-primary" id="filter-all">All</button>
          <button class="btn btn-ghost" id="filter-open">Open</button>
          <button class="btn btn-ghost" id="filter-mitigated">Mitigated</button>
        </div>

        <div class="card">
          <div style="overflow-x:auto;">
            <table class="tl-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Severity</th>
                  <th>GitHub Issue</th>
                  <th>Sprint</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="backlog-tb"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./assets/app.js"></script>
  <script>
    document.addEventListener('tl-data-ready', () => {
      window.renderSharedTopbar();
      const threats = window.TLData.threats;
      const tickets = window.TLData.tickets;
      
      if (window.TLData.runs.length > 0) {
        document.getElementById('sync-status-text').textContent = 'Last synced: ' + window.formatDate(window.TLData.runs[0].timestamp);
      }

      threats.forEach(t => {
        const localStatus = localStorage.getItem('tl_status_' + t.id);
        if(localStatus) t.status = localStatus;
      });

      let currentFilter = 'ALL';

      const renderTable = () => {
        const tb = document.getElementById('backlog-tb');
        let filtered = threats;
        if(currentFilter !== 'ALL') {
          filtered = threats.filter(t => t.status === currentFilter);
        }

        if(filtered.length === 0) {
          tb.innerHTML = '<tr><td colspan="7">No items found.</td></tr>';
          return;
        }

        tb.innerHTML = filtered.map((t, idx) => {
          const ticket = tickets.find(tk => tk.threatId === t.id);
          const issueHtml = ticket ? `<a href="${ticket.issueUrl}" target="_blank">#${ticket.issueNumber}</a>` : '<span class="muted">-</span>';
          
          let sprint = 'Sprint 1'; // Derive logic: just mock based on runId
          if(t.runId) sprint = 'Sprint ' + t.runId.replace('run-00', '');

          return `
            <tr>
              <td class="mono">${idx+1}</td>
              <td><a href="threat-detail.html?id=${t.id}">${window.escapeHtml(t.title)}</a></td>
              <td>${window.formatCategory(t.category)}</td>
              <td>${window.formatSeverity(t.severity)}</td>
              <td>${issueHtml}</td>
              <td>${sprint}</td>
              <td>${window.formatStatus(t.status)}</td>
            </tr>
          `;
        }).join('');
      };

      renderTable();

      const btns = {
        'ALL': document.getElementById('filter-all'),
        'OPEN': document.getElementById('filter-open'),
        'MITIGATED': document.getElementById('filter-mitigated')
      };

      Object.keys(btns).forEach(key => {
        if(!btns[key]) return;
        btns[key].addEventListener('click', () => {
          Object.values(btns).forEach(b => { b.classList.remove('btn-primary'); b.classList.add('btn-ghost'); });
          btns[key].classList.remove('btn-ghost');
          btns[key].classList.add('btn-primary');
          currentFilter = key;
          renderTable();
        });
      });
    });
  </script>
</body>
</html>
